server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Proxy all /api/* requests to the FastAPI backend, stripping the /api prefix.
    # This avoids CORS entirely — the browser sees one origin for both frontend and API.
    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA fallback — unknown paths go to index.html so React Router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
